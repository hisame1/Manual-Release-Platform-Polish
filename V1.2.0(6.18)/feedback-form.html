<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinie klientów</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .feedback-container {
            width: 100%;
            max-width: 600px;
            background: #252525;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .feedback-title {
            font-size: 24px;
            color: #4a9eff;
            margin-bottom: 8px;
            text-align: center;
        }
        .feedback-subtitle {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-label .required {
            color: #ff6b6b;
            margin-left: 4px;
        }
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }
        .file-upload {
            position: relative;
            display: block;
            padding: 40px 20px;
            background: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover {
            border-color: #4a9eff;
            background: #252530;
        }
        .file-upload input[type="file"] {
            position: absolute;
            top:0;
            left:0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-upload-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .file-upload-text {
            font-size: 14px;
            color: #888;
        }
        .file-upload-hint {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .file-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 6px;
            margin-top: 10px;
        }
        .file-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .file-preview-info {
            flex:1;
        }
        .file-preview-name {
            font-size: 13px;
            color: #fff;
        }
        .file-preview-size {
            font-size: 11px;
            color: #888;
        }
        .file-preview-remove {
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #3a8eef;
            transform: translateY(-2px);
        }
        .submit-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .submit-btn.loading {
            background: #666;
        }
        .success-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success-message.show {
            display: block;
        }
        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .success-title {
            font-size: 24px;
            color: #4a9eff;
            margin-bottom: 10px;
        }
        .success-text {
            font-size: 14px;
            color: #888;
            line-height:1.6;
        }
        .error-message {
            display: none;
            padding: 12px 16px;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .error-message.show {
            display: block;
        }
        .feedback-embed .feedback-container {
            max-width: 100%;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <!-- Formularz -->
        <div id="feedbackForm">
            <h1 class="feedback-title">Opinie klientów</h1>
            <p class="feedback-subtitle">Skontaktujemy się z Tobą drogą mailową tak szybko, jak to możliwe</p>

            <div class="error-message" id="errorMessage"></div>

            <form id="form">
                <!-- Kraj (wprowadzanie tekstu) -->
                <div class="form-group">
                    <label class="form-label">
                        Kraj <span class="required">*</span>
                    </label>
                    <input type="text" class="form-input" name="country" placeholder="Wprowadź swój kraj" required>
                </div>

                <!-- Model samochodu (wprowadzanie tekstu) -->
                <div class="form-group">
                    <label class="form-label">
                        Model samochodu <span class="required">*</span>
                    </label>
                    <input type="text" class="form-input" name="carModel" placeholder="Wprowadź model swojego samochodu" required>
                </div>

                <!-- Opis problemu -->
                <div class="form-group">
                    <label class="form-label">
                        Opis problemu <span class="required">*</span>
                    </label>
                    <textarea class="form-textarea" name="description" placeholder="Opisz szczegółowo swój problem..." required></textarea>
                </div>

                <!-- E-mail -->
                <div class="form-group">
                    <label class="form-label">
                        Twój e-mail <span class="required">*</span>
                    </label>
                    <input type="email" class="form-input" name="email" placeholder="example@email.com" required>
                </div>

                <!-- Przesyłanie obrazu -->
                <div class="form-group">
                    <label class="form-label">Prześlij obraz (maks. 5 MB)</label>
                    <label class="file-upload" id="imageUpload">
                        <input type="file" name="image" accept="image/*" id="imageInput">
                        <div class="file-upload-icon">📷</div>
                        <div class="file-upload-text">Kliknij, aby przesłać obraz</div>
                        <div class="file-upload-hint">JPG, PNG, GIF do 5 MB</div>
                    </label>
                    <div id="imagePreview"></div>
                </div>

                <!-- Link do wideo -->
                <div class="form-group">
                    <label class="form-label">Link do wideo (Google Drive itp.)</label>
                    <input type="url" class="form-input" name="videoLink" placeholder="https://drive.google.com/...">
                    <p style="font-size: 12px; color: #666; margin-top: 6px;">
                        Filmy większe niż 5 MB prześlij na Google Drive i udostępnij link
                    </p>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Wyślij opinię</button>
            </form>
        </div>

        <!-- Komunikat o sukcesie -->
        <div class="success-message" id="successMessage">
            <div class="success-icon">✅</div>
            <h2 class="success-title">Wysłano pomyślnie!</h2>
            <p class="success-text">
                Otrzymaliśmy Twoją opinię.<br>
                Nasz zespół wkrótce skontaktuje się z Tobą drogą mailową.
            </p>
        </div>
    </div>

    <script>
        // URL funkcji chmurowej Tencent
        var WORKER_URL = 'https://1410776270-jd7ixwhwuy.ap-shanghai.tencentscf.com';

        var form = document.getElementById('form');
        var submitBtn = document.getElementById('submitBtn');
        var errorMessage = document.getElementById('errorMessage');
        var successMessage = document.getElementById('successMessage');
        var feedbackForm = document.getElementById('feedbackForm');
        var imageInput = document.getElementById('imageInput');
        var imagePreview = document.getElementById('imagePreview');

        var imageBase64 = '';

        // Podgląd przesłanego obrazu
        imageInput.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showError('Rozmiar obrazu musi być mniejszy niż 5 MB');
                imageInput.value = '';
                return;
            }

            if (!file.type.startsWith('image/')) {
                showError('Prześlij plik obrazu');
                imageInput.value = '';
                return;
            }

            var reader = new FileReader();
            reader.onload = function(event) {
                imageBase64 = event.target.result;
                showImagePreview(file.name, file.size, imageBase64);
            };
            reader.readAsDataURL(file);
        });

        function showImagePreview(name, size, base64) {
            var sizeStr = size < 1024 * 1024
                ? (size / 1024).toFixed(1) + ' KB'
                : (size / (1024 * 1024)).toFixed(1) + ' MB';

            imagePreview.innerHTML = '<div class="file-preview">' +
                '<img src="' + base64 + '" alt="Podgląd">' +
                '<div class="file-preview-info">' +
                    '<div class="file-preview-name">' + name + '</div>' +
                    '<div class="file-preview-size">' + sizeStr + '</div>' +
                '</div>' +
                '<button type="button" class="file-preview-remove" onclick="removeImage()">Usuń</button>' +
            '</div>';
        }

        window.removeImage = function() {
            imageBase64 = '';
            imageInput.value = '';
            imagePreview.innerHTML = '';
        };

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            setTimeout(function() {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // Przesyłanie formularza
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            console.log('[Feedback] Rozpoczęcie przesyłania formularza...');

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Wysyłanie...';

            var formData = {
                country: form.elements['country'].value,
                carModel: form.elements['carModel'].value,
                description: form.elements['description'].value,
                email: form.elements['email'].value,
                videoLink: form.elements['videoLink'].value,
                imageBase64: imageBase64
            };

            console.log('[Feedback] Przesyłane dane:', {
                country: formData.country,
                carModel: formData.carModel,
                hasImage: !!imageBase64,
                imageSize: imageBase64 ? imageBase64.length : 0
            });

            try {
                console.log('[Feedback] Wysyłanie żądania do:', WORKER_URL);
                var response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                console.log('[Feedback] Status odpowiedzi:', response.status, response.statusText);

                // Najpierw sprawdź kod statusu HTTP
                if (!response.ok) {
                    var errText = await response.text();
                    console.error('[Feedback] Błąd odpowiedzi serwera:', errText);
                    throw new Error('Błąd serwera: ' + response.status + ' ' + errText);
                }

                var result = await response.json();
                console.log('[Feedback] Dane odpowiedzi:', result);

                // Sprawdź pole success w odpowiedzi
                if (result.success) {
                    console.log('[Feedback] Wyświetlanie komunikatu o sukcesie');
                    feedbackForm.style.display = 'none';
                    successMessage.classList.add('show');
                } else {
                    // Wyświetl konkretny błąd zwrócony przez backend
                    var errorMsg = result.error || result.bitableError || 'Wysyłanie nie powiodło się';
                    console.error('[Feedback] Wysyłanie nie powiodło się:', errorMsg);
                    showError('Wysyłanie nie powiodło się: ' + errorMsg);
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                    submitBtn.textContent = 'Wyślij opinię';
                }
                console.log('[Feedback] Komunikat o sukcesie wyświetlony');

            } catch (err) {
                console.error('[Feedback] Wysyłanie nie powiodło się:', err);
                showError('Wysyłanie nie powiodło się: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'Wyślij opinię';
            }
        });
    </script>
</body>
</html>
